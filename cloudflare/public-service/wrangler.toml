name = "whitelist-monitor-tg-relay"
main = "src/index.ts"
compatibility_date = "2026-07-29"

[vars]
REPORT_PRIMARY_WINDOW_MINUTES = "30"
REPORT_FALLBACK_WINDOW_MINUTES = "120"
MIN_UNIQUE_INSTALLATIONS = "3"
MIN_UNIQUE_INSTALLATIONS_FOR_CITY = "5"
CONSENSUS_NUMERATOR = "2"
CONSENSUS_DENOMINATOR = "3"
DEVICE_ONLINE_TIMEOUT_SECONDS = "45"
COMMAND_TTL_SECONDS = "120"
COMMAND_COOLDOWN_SECONDS = "60"
DEVICE_POLL_INTERVAL_SECONDS = "15"
REPORT_RETENTION_DAYS = "7"
COMMAND_RETENTION_HOURS = "24"
LINK_CODE_TTL_MINUTES = "10"
PUBLIC_MODE_ENABLED = "true"

[[d1_databases]]
binding = "DB"
database_name = "whitelist-public-service"
database_id = "37b43d63-d170-448b-9138-cdb27343168e"
