name: Public Service CI

on:
  pull_request:
    paths:
      - "cloudflare/public-service/**"
      - ".github/workflows/public-service.yml"
  push:
    branches:
      - main
    paths:
      - "cloudflare/public-service/**"
      - ".github/workflows/public-service.yml"

permissions:
  contents: read

jobs:
  verify:
    name: Verify Worker
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cloudflare/public-service

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: cloudflare/public-service/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Build dry run
        run: npm run build
